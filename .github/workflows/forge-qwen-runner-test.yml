name: Forge Qwen Runner Test

on:
  workflow_dispatch:
  push:
    branches: [forge-runner-test]

permissions:
  contents: read

jobs:
  qwen-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download llama.cpp
        run: |
          curl -L --fail --retry 3 -o /tmp/llama.tar.gz \
            https://github.com/ggml-org/llama.cpp/releases/download/b11017/llama-b11017-bin-ubuntu-x64.tar.gz
          mkdir -p /tmp/llama
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          find /tmp/llama -type f -name llama-cli -print -exec chmod +x {} \;

      - name: Restore Qwen model cache
        uses: actions/cache@v4
        with:
          path: /tmp/models
          key: qwen25-coder-3b-q3km-v1

      - name: Download Qwen model
        run: |
          mkdir -p /tmp/models
          MODEL=/tmp/models/qwen2.5-coder-3b-instruct-q3_k_m.gguf
          if [ ! -s "$MODEL" ]; then
            curl -L --fail --retry 5 --retry-all-errors --progress-bar \
              -o "$MODEL" \
              'https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q3_k_m.gguf?download=true'
          fi
          echo 'fc3937db7dda9d9ef68ce1f63b5a84ac850ec3c07578461d645e5a88509348e3  '$MODEL | sha256sum -c -
          ls -lh "$MODEL"

      - name: Run Qwen benchmark
        run: |
          BIN="$(find /tmp/llama -type f -name llama-cli | head -1)"
          MODEL=/tmp/models/qwen2.5-coder-3b-instruct-q3_k_m.gguf
          "$BIN" \
            -m "$MODEL" \
            -c 2048 \
            -t 4 \
            -tb 4 \
            -n 64 \
            -st \
            --perf \
            --no-display-prompt \
            -p 'Write a JavaScript function named add that takes two numbers and returns their sum. Return only the code.'
