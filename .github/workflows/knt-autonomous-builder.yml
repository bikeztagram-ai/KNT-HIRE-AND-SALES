name: KNT Autonomous Builder — PROVEN Aider

on:
  workflow_dispatch:
    inputs:
      max_units:
        description: 'Safety ceiling for the autonomous run'
        required: false
        default: '1000'
        type: string
      duration:
        description: 'Total autonomous work budget (automatically segmented under GitHub job limits)'
        required: false
        default: '15m'
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','5h30m']
      local_model:
        description: 'Local coding model'
        required: false
        default: 'qwen2.5-coder:7b'
        type: string
concurrency:
  group: knt-autonomous-builder
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
env:
  BUILDER_MAX_UNITS: ${{ inputs.max_units }}
  REQUESTED_DURATION: ${{ inputs.duration }}
  LOCAL_AI_MODEL: ${{ inputs.local_model }}
  AUTOBOT_AIDER_MODEL: ollama_chat/${{ inputs.local_model }}
  AUTOBOT_FEATURE_ENGINE: aider-repo-map-v4
  AUTOBOT_FEATURE_PROTOCOL: aider-repo-map-v4
  AUTOBOT_WORKER_CONFIG_VERSION: knt-proven-aider-v4
  AUTOBOT_FINISH_GRACE_MINUTES: 5
  AUTOBOT_FEATURE_SLICE_MINUTES: 20
  AUTOBOT_FEATURE_PASSES: 2
  AUTOBOT_FEATURE_PASSES_PER_SLICE: 2
  AUTOBOT_FEATURE_MAX_ATTEMPTS: 2
  AUTOBOT_MAX_FEATURE_CYCLES: 24
  AUTOBOT_MAX_NO_PROGRESS_ITERATIONS: 2
  BUILDER_BASE_BRANCH: feature/knt-v1-foundation
  AUTOBOT_SEGMENT_MAX_MINUTES: 300

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout KNT product baseline
        uses: actions/checkout@v5
        with:
          ref: feature/knt-v1-foundation
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install proven Aider engine
        run: python -m pip install --disable-pip-version-check --no-input aider-chat
      - name: Cache local Qwen model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: knt-local-qwen-${{ runner.os }}-${{ inputs.local_model }}
      - name: Start local Qwen brain
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
        run: bash scripts/autobot/install-local-brain.sh
      - name: Start KNT Ollama performance proxy
        run: |
          set -euo pipefail
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/knt-ollama-proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:11435/health >/dev/null
          echo 'OLLAMA_API_BASE=http://127.0.0.1:11435' >> "$GITHUB_ENV"
          echo 'OLLAMA_HOST=http://127.0.0.1:11435' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_PROXY_NUM_CTX=8192' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_PROXY_NUM_PREDICT=1500' >> "$GITHUB_ENV"
      - name: Resolve total and safe segment budget
        run: |
          set -euo pipefail
          case "$REQUESTED_DURATION" in
            15m) total=15;; 30m) total=30;; 1h) total=60;; 2h) total=120;; 3h) total=180;; 4h) total=240;; 5h) total=300;; 5h30m) total=330;;
            *) echo "Unsupported duration: $REQUESTED_DURATION"; exit 1;;
          esac
          segment="$total"
          if [ "$segment" -gt "$AUTOBOT_SEGMENT_MAX_MINUTES" ]; then segment="$AUTOBOT_SEGMENT_MAX_MINUTES"; fi
          echo "TOTAL_BUILDER_MINUTES=$total" >> "$GITHUB_ENV"
          echo "BUILDER_MAX_MINUTES=$segment" >> "$GITHUB_ENV"
          echo "BUILDER_SEGMENT=1" >> "$GITHUB_ENV"
          echo "AUTOBOT_TOTAL_BUDGET_MINUTES=$total" >> "$GITHUB_ENV"
          echo "[autobot] total budget=${total}m; this job segment=${segment}m; continuation will carry remaining budget safely."
      - name: Create durable KNT checkpoint branch
        run: |
          set -euo pipefail
          branch="autonomous-builder-knt/${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          echo "BUILDER_WORKING_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Validate KNT exact file contract
        run: |
          set -euo pipefail
          node --check scripts/autobot/verify-knt-file-contract.mjs
          node scripts/autobot/verify-knt-file-contract.mjs
      - name: Validate KNT Aider AutoBot
        run: |
          set -euo pipefail
          test "$AUTOBOT_FEATURE_ENGINE" = aider-repo-map-v4
          test "$AUTOBOT_FEATURE_PROTOCOL" = aider-repo-map-v4
          test "$AUTOBOT_FEATURE_SLICE_MINUTES" = 20
          test "$AUTOBOT_FEATURE_PASSES" = 2
          node --check builder/runner/aider-feature-brain.mjs
          node --check builder/runner/aider-state-store.mjs
          node --check builder/runner/ollama-performance-proxy.mjs
          node --check builder/runner/long-run-executor.mjs
          node scripts/autobot/verify-knt-aider-feature-engine.mjs
          node scripts/autobot/repository-intelligence.mjs
          test -f builder/brain/knt-autobot-product-directive.md
          curl -fsS "$OLLAMA_API_BASE/api/tags" >/dev/null
      - name: Run sustained KNT Aider builder
        run: node builder/runner/long-run-executor.mjs
      - name: Production verification
        if: success()
        run: npm run build
      - name: Publish verified KNT product checkpoint branch
        if: success()
        run: |
          set -euo pipefail
          git diff --quiet
          ahead=$(git rev-list --count "origin/${BUILDER_BASE_BRANCH}..HEAD")
          test "$ahead" -ge 1
          git push --set-upstream origin "$BUILDER_WORKING_BRANCH"
          echo "[autobot] VERIFIED KNT PRODUCT CHECKPOINT: $BUILDER_WORKING_BRANCH"
      - name: Calculate remaining shared budget
        id: budget
        if: success()
        run: |
          set -euo pipefail
          state='builder/working/long-run-state.json'
          test -s "$state"
          used="$(node -e "const s=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log(Math.max(0,Math.ceil(Number(s.elapsedMinutes||0))) )" "$state")"
          remaining=$(( TOTAL_BUILDER_MINUTES - used ))
          if [ "$remaining" -lt 0 ]; then remaining=0; fi
          no_progress="$(node -e "const s=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log(Number(s.consecutiveNoProgress||0))" "$state")"
          echo "used=$used" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "no_progress=$no_progress" >> "$GITHUB_OUTPUT"
          echo "[autobot] segment used=${used}m; shared budget remaining=${remaining}m; consecutive no-progress=${no_progress}"

      - name: Dispatch next KNT continuation segment
        if: success() && steps.budget.outputs.remaining != '0' && steps.budget.outputs.no_progress != '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run knt-autonomous-builder-continuation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BUILDER_WORKING_BRANCH" \
            -f continuation_ref="$BUILDER_WORKING_BRANCH" \
            -f remaining_minutes="${{ steps.budget.outputs.remaining }}" \
            -f max_units="$BUILDER_MAX_UNITS" \
            -f local_model="$LOCAL_AI_MODEL" \
            -f total_budget_minutes="$TOTAL_BUILDER_MINUTES"
      - name: Upload KNT AutoBot state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knt-aider-autobot-${{ github.run_id }}
          path: |
            builder/working/*.json
            builder/working/*.jsonl
          if-no-files-found: ignore
