name: KNT Autonomous Builder — Qwen

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Shared AutoBot work time budget'
        required: false
        default: '30m'
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','6h']
      max_units:
        description: 'Safety ceiling for future deterministic work'
        required: false
        default: '1000'
        type: string
      local_model:
        description: 'Local Qwen coding model'
        required: false
        default: 'qwen2.5-coder:7b'
        type: string

concurrency:
  group: knt-autonomous-builder
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  REQUESTED_DURATION: ${{ inputs.duration }}
  LOCAL_AI_MODEL: ${{ inputs.local_model }}
  BUILDER_MAX_UNITS: ${{ inputs.max_units }}
  BUILDER_BASE_BRANCH: feature/knt-v1-foundation
  AUTOBOT_FEATURE_ENGINE: qwen-ollama

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Checkout KNT product baseline
        uses: actions/checkout@v5
        with:
          ref: feature/knt-v1-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Start local Qwen brain
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
        run: bash scripts/autobot/install-local-brain.sh

      - name: Resolve duration
        run: |
          set -euo pipefail
          case "$REQUESTED_DURATION" in
            15m) minutes=15;;
            30m) minutes=30;;
            1h) minutes=60;;
            2h) minutes=120;;
            3h) minutes=180;;
            4h) minutes=240;;
            5h) minutes=300;;
            6h) minutes=360;;
            *) echo "Unsupported duration: $REQUESTED_DURATION"; exit 1;;
          esac
          echo "BUILDER_MAX_MINUTES=$minutes" >> "$GITHUB_ENV"
          echo "[autobot] KNT Qwen budget: ${minutes}m"

      - name: Validate Qwen AutoBot
        run: |
          node --check builder/runner/feature-brain.mjs
          node --check builder/runner/long-run-executor.mjs
          node --check scripts/autobot/repository-intelligence.mjs
          node --check builder/quality/audit-log.mjs
          node builder/quality/audit-log.mjs

      - name: Run sustained KNT Qwen AutoBot
        run: node builder/runner/long-run-executor.mjs

      - name: Production verification
        if: success()
        run: npm run build

      - name: Publish verified checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="autonomous-builder-knt/${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name 'KNT Qwen Autonomous Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: KNT Qwen AutoBot verified checkpoint' || true
          git push --set-upstream origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base feature/knt-v1-foundation --head "$branch" --draft --title 'KNT Qwen AutoBot verified checkpoint' --body 'Verified autonomous KNT product checkpoint produced by the local Qwen/Ollama AutoBot. Review required before merge into the KNT foundation branch.' || true

      - name: Upload AutoBot state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knt-qwen-autobot-${{ github.run_id }}
          path: |
            builder/working/*.json
            builder/working/*.jsonl
          if-no-files-found: ignore
