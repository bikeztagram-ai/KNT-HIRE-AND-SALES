name: KNT Autonomous Builder — PROVEN Qwen

on:
  workflow_dispatch:
    inputs:
      max_units:
        description: 'Safety ceiling for future deterministic work'
        required: false
        default: '1000'
        type: string
      duration:
        description: 'Shared AutoBot work time budget'
        required: false
        default: '30m'
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','6h']
      local_model:
        description: 'Local coding model'
        required: false
        default: 'qwen2.5-coder:7b'
        type: string
concurrency:
  group: knt-autonomous-builder
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  actions: write
env:
  BUILDER_MAX_UNITS: ${{ inputs.max_units }}
  REQUESTED_DURATION: ${{ inputs.duration }}
  LOCAL_AI_MODEL: ${{ inputs.local_model }}
  AUTOBOT_AIDER_MODEL: ollama_chat/${{ inputs.local_model }}
  AUTOBOT_FEATURE_ENGINE: aider
  AUTOBOT_WORKER_CONFIG_VERSION: knt-aider-v3-resumable
  AUTOBOT_FINISH_GRACE_MINUTES: 5
  AUTOBOT_FEATURE_SLICE_MINUTES: 15
  AUTOBOT_FEATURE_PASSES_PER_SLICE: 2
  BUILDER_BASE_BRANCH: feature/knt-v1-foundation
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Checkout KNT product baseline
        uses: actions/checkout@v5
        with:
          ref: feature/knt-v1-foundation
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Aider engine
        run: python -m pip install --disable-pip-version-check --no-input aider-chat
      - name: Cache local AI model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: knt-local-ai-${{ runner.os }}-${{ inputs.local_model }}
      - name: Start local Qwen brain
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
        run: bash scripts/autobot/install-local-brain.sh
      - name: Start performance proxy
        run: |
          set -euo pipefail
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/knt-ollama-proxy.log 2>&1 &
          proxy_ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1; then proxy_ready=true; break; fi
            sleep 1
          done
          if [ "$proxy_ready" != true ]; then
            echo 'KNT Ollama performance proxy failed to start.'
            cat /tmp/knt-ollama-proxy.log || true
            exit 1
          fi
          echo 'OLLAMA_HOST=http://127.0.0.1:11435' >> "$GITHUB_ENV"
          echo 'AUTOBOT_AIDER_CALL_TIMEOUT_MS=1200000' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_PROXY_NUM_CTX=8192' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_PROXY_NUM_PREDICT=1500' >> "$GITHUB_ENV"
          echo '[autobot] KNT performance proxy ready; Aider repo-map engine selected.'
      - name: Resolve duration
        run: |
          set -euo pipefail
          case "$REQUESTED_DURATION" in
            15m) minutes=15;; 30m) minutes=30;; 1h) minutes=60;; 2h) minutes=120;; 3h) minutes=180;; 4h) minutes=240;; 5h) minutes=300;; 6h) minutes=360;;
            *) echo "Unsupported duration: $REQUESTED_DURATION"; exit 1;;
          esac
          echo "BUILDER_MAX_MINUTES=$minutes" >> "$GITHUB_ENV"
          echo "[autobot] KNT proven Qwen budget: ${minutes}m + ${AUTOBOT_FINISH_GRACE_MINUTES}m finish grace"
      - name: Validate proven AutoBot
        run: |
          set -euo pipefail
          test "$AUTOBOT_FEATURE_ENGINE" = aider
          test "$AUTOBOT_FEATURE_PASSES_PER_SLICE" = 2
          test -f builder/runner/aider-feature-brain.mjs
          test -f builder/runner/aider-state-store.mjs
          test -f builder/runner/ollama-performance-proxy.mjs
          node --check builder/runner/long-run-executor.mjs
          node --check builder/runner/aider-feature-brain.mjs
          node --check builder/runner/aider-state-store.mjs
          node --check builder/runner/ollama-performance-proxy.mjs
          node --check builder/quality/audit-log.mjs
          node builder/quality/audit-log.mjs
          echo '[autobot] KNT proven Aider/Qwen safety checks passed.'
      - name: Run proven sustained KNT builder
        run: node builder/runner/long-run-executor.mjs
      - name: Production verification
        if: success()
        run: npm run build
      - name: Publish clean product checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git restore -- builder/working builder/quality 2>/dev/null || true
          rm -f .aider.chat.history.md .aider.input.history
          rm -rf .aider.tags.cache.v4
          git clean -fd -- builder/working builder/quality .aider.tags.cache.v4 2>/dev/null || true
          branch="autonomous-builder-knt/${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name 'KNT Qwen Autonomous Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src package.json
          git commit -m 'feat: KNT proven Qwen AutoBot checkpoint' || true
          git push --set-upstream origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base feature/knt-v1-foundation --head "$branch" --draft --title 'KNT proven Qwen AutoBot checkpoint' --body 'Verified KNT product checkpoint produced by the Bikeztagram-proven Aider repository-map engine with local Ollama/Qwen. Review required before merge.' || true
      - name: Upload AutoBot state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knt-proven-qwen-autobot-${{ github.run_id }}
          path: |
            builder/working/*.json
            builder/working/*.jsonl
          if-no-files-found: ignore
