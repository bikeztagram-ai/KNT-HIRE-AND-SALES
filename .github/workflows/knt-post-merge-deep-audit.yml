name: KNT Post-Merge Deep Audit

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repair:
        description: 'Create a repair PR if the audit finds problems'
        required: false
        default: 'true'
        type: choice
        options: ['true','false']

permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: knt-post-merge-audit
  cancel-in-progress: false

jobs:
  audit-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Machine deep audit
        id: machine
        continue-on-error: true
        run: node scripts/autobot/deep-knt-audit.mjs
      - name: Start local Qwen
        if: steps.machine.outcome != 'success'
        env:
          LOCAL_AI_MODEL: qwen2.5-coder:7b
        run: bash scripts/autobot/install-local-brain.sh
      - name: Start Ollama proxy
        if: steps.machine.outcome != 'success'
        run: |
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/knt-audit-proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:11435/health >/dev/null
          echo 'OLLAMA_API_BASE=http://127.0.0.1:11435' >> "$GITHUB_ENV"
      - name: Install Aider
        if: steps.machine.outcome != 'success'
        run: python -m pip install --disable-pip-version-check --no-input aider-chat
      - name: Create repair branch
        if: steps.machine.outcome != 'success' && (github.event_name == 'push' || inputs.repair == 'true')
        run: |
          git checkout -b "autobot/post-merge-repair-${GITHUB_RUN_ID}"
          git config user.name 'KNT Autonomous Repair Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Deep AI audit and bounded repair
        if: steps.machine.outcome != 'success' && (github.event_name == 'push' || inputs.repair == 'true')
        env:
          AUTOBOT_AIDER_MODEL: ollama_chat/qwen2.5-coder:7b
        run: |
          set -euo pipefail
          aider --model="$AUTOBOT_AIDER_MODEL" --yes-always --no-auto-commits --no-dirty-commits --no-gitignore --map-tokens=768 --message "Perform a DEEP KNT Hire & Sales post-merge audit. Inspect the whole src/ tree and its callers/contracts. Find mismatches between components, routes, data helpers, Supabase contracts, field names, status values, evidence handling, compliance dates, supplier/parts flows and invoice review rules. Check for dead/unwired UI, stale assumptions, incorrect imports/exports, inconsistent naming, broken data flow, misleading success states, and regressions that a normal build would miss. Fix only real issues you can justify. Preserve KNT business safety and do not invent data. Run npm run build before finishing. Do not change builder infrastructure or workflows." src
      - name: Final repair verification
        if: steps.machine.outcome != 'success' && (github.event_name == 'push' || inputs.repair == 'true')
        run: |
          node scripts/autobot/deep-knt-audit.mjs
          git diff --check
      - name: Open repair PR for human merge
        if: steps.machine.outcome != 'success' && (github.event_name == 'push' || inputs.repair == 'true') && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src
          git commit -m "fix: post-merge KNT deep-audit repair" || true
          git push --set-upstream origin "autobot/post-merge-repair-${GITHUB_RUN_ID}"
          gh pr create --base main --head "autobot/post-merge-repair-${GITHUB_RUN_ID}" --draft --title "KNT post-merge deep-audit repair" --body "Automated post-merge deep audit found a repository mismatch or regression. Machine and AI audit/repair completed. Human review and merge required. After merge, the post-merge audit will run again."
      - name: Fail if audit still has issues
        if: steps.machine.outcome != 'success' && (github.event_name == 'push' && failure())
        run: exit 1
