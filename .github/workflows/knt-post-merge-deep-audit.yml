name: KNT Post-Merge Deep Audit

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repair:
        description: 'Create a repair PR if the deep audit finds a real issue'
        required: false
        default: 'true'
        type: choice
        options: ['true','false']

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: knt-post-merge-deep-audit
  cancel-in-progress: false

jobs:
  audit-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Machine deep audit baseline
        id: machine
        continue-on-error: true
        run: node scripts/autobot/deep-knt-audit.mjs

      - name: Start local Qwen
        env:
          LOCAL_AI_MODEL: qwen2.5-coder:7b
        run: bash scripts/autobot/install-local-brain.sh

      - name: Start Ollama proxy
        run: |
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/knt-audit-proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:11435/health >/dev/null
          echo 'OLLAMA_API_BASE=http://127.0.0.1:11435' >> "$GITHUB_ENV"

      - name: Install Aider
        run: python -m pip install --disable-pip-version-check --no-input aider-chat

      - name: Create repair branch
        if: github.event_name == 'push' || inputs.repair == 'true'
        run: |
          git checkout -b "autobot/post-merge-repair-${GITHUB_RUN_ID}"
          git config user.name 'KNT Autonomous Repair Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Deep AI audit and repair
        if: github.event_name == 'push' || inputs.repair == 'true'
        env:
          AUTOBOT_AIDER_MODEL: ollama_chat/qwen2.5-coder:7b
        run: |
          set -euo pipefail
          aider --model="$AUTOBOT_AIDER_MODEL" --yes-always --no-auto-commits --no-dirty-commits --no-gitignore --map-tokens=768 --message "You are performing the KNT Hire & Sales post-merge deep audit. Inspect the whole src tree and its callers/contracts, not just the last change. Check component wiring, routes, data helpers and exports, Supabase field/table contracts, field names and status values, evidence/photo retention, service and LOLER dates, supplier/parts linkage, invoice human-review rules, loading/error states, dead or unreachable UI, stale assumptions, duplicated/conflicting logic, and mismatches between what the UI says and what the data layer actually persists. Look for defects a normal npm build will miss. Compare related screens and shared helpers for consistency. Fix only real issues you can justify, with the smallest coherent production changes. Preserve authentication, shared cloud access, evidence provenance, compliance dates, supplier source paperwork and mandatory human invoice review. Do not invent business data. Do not modify builder infrastructure or workflows. Run npm run build when finished."

      - name: Final deep audit gate
        if: success()
        run: |
          node scripts/autobot/deep-knt-audit.mjs
          git diff --check

      - name: Publish repair PR only when code changed
        if: success() && (github.event_name == 'push' || inputs.repair == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src; then
            echo "DEEP AUDIT CLEAN — no repair required."
            exit 0
          fi
          git add src
          git commit -m "fix: post-merge KNT deep-audit repair"
          git push --set-upstream origin "autobot/post-merge-repair-${GITHUB_RUN_ID}"
          gh pr create --base main --head "autobot/post-merge-repair-${GITHUB_RUN_ID}" --draft --title "KNT post-merge deep-audit repair" --body "Deep post-merge audit identified and repaired a KNT code mismatch/regression. Machine verification is green. Human review and merge required. The audit will run again automatically after that merge."

      - name: Report audit result
        if: always()
        run: |
          echo "KNT post-merge audit completed. A clean audit produces no repair PR; a repaired audit produces a draft PR for human review and merge."
